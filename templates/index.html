
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteNest - Personal Notes</title>
   <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Login Section -->
    <div class="auth-container" id="authSection">

        <div class="auth-card">
            <h1>NoteNest</h1>
            <p class="subtitle">Your personal space for ideas.</p>

            <div class="auth-tabs">
                <button id="loginTab" class="active">Login</button>
                <button id="signupTab">Sign Up</button>
            </div>

            <form id="authForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Your Name"
                    class="hidden"
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit" class="primary-btn" id="authButton">
                    Login
                </button>

            </form>

            <p id="authMessage"></p>
        </div>

    </div>


    <!-- Dashboard Section -->
    <div class="dashboard hidden" id="dashboard">

        <header class="navbar">
            <h2>NoteNest</h2>

            <div class="nav-right">
                <span id="welcomeName">Welcome!</span>
                <button id="logoutBtn" class="logout-btn">Logout</button>
            </div>
        </header>


        <main class="main-content">

            <section class="welcome-section">
                <div>
                    <h1>My Notes</h1>
                    <p>Keep your thoughts organized in one place.</p>
                </div>

                <button id="addNoteBtn" class="primary-btn">
                    + New Note
                </button>
            </section>


            <!-- Search -->
            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search your notes..."
                >
            </div>


            <!-- Note Form -->
            <section class="note-form hidden" id="noteFormSection">

                <h2 id="formHeading">Create New Note</h2>

                <form id="noteForm">

                    <input
                        type="text"
                        id="noteTitle"
                        placeholder="Enter note title"
                        required
                    >

                    <textarea
                        id="noteContent"
                        placeholder="Write your note here..."
                        required
                    ></textarea>

                    <div class="form-buttons">
                        <button type="submit" class="primary-btn" id="saveBtn">
                            Save Note
                        </button>

                        <button type="button" id="cancelBtn" class="cancel-btn">
                            Cancel
                        </button>
                    </div>

                </form>

            </section>


            <!-- Notes -->
            <section class="notes-section">

                <div class="notes-header">
                    <h2>All Notes</h2>
                    <span id="notesCount">0 Notes</span>
                </div>

                <div id="notesContainer" class="notes-container">

                    <div class="empty-state">
                        <h3>No notes yet</h3>
                        <p>Click on New Note to create your first note.</p>
                    </div>

                </div>

            </section>

        </main>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
<div id="toastContainer"></div>
</body>
</html>
